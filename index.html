<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Amazon Realty Group | NYC Property Management</title>
  <meta name="description" content="Experienced property management for rental buildings, commercial spaces, and new condominiums in New York City. Since 2008." />

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/benjamins123/amazonrealtygrp/7387b668d8da20b44bc74be931c4715804faf11f/image%20(4).png">

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary-purple: #6a1b9a;  /* Rich purple for accents */
      --light-purple: #9c27b0;    /* Hover/light variation */
      --black: #0a0a0a;           /* Deep, warm black */
      --silver: #d4d4d4;          /* Metallic silver for borders */
      --light-silver: #f8f8f8;    /* Soft silver for backgrounds */
      --transition: all 0.2s ease;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      line-height: 1.7;
      color: #333;
      background: #fff;
    }

    a { color: var(--primary-purple); text-decoration: none; }
    a:hover { color: var(--light-purple); }

    .container {
      width: 90%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 1rem;
    }

    /* === ULTRA-CLEAN HEADER === */
    header {
      background: var(--black);
      color: white;
      position: sticky;
      top: 0;
      z-index: 1000;
      height: 50px;
      display: flex;
      align-items: center;
      box-shadow: 0 1px 5px rgba(0,0,0,0.1);
    }

    .header-inner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
    }

    .logo {
      display: flex;
      align-items: center;
      font-size: 1.1rem;
      font-weight: 600;
      color: white;
    }

    .logo img {
      height: 32px;
      width: auto;
      margin-right: 8px;
    }

    .logo span {
      color: var(--primary-purple);
    }

    /* Desktop Nav */
    .nav-desktop {
      display: flex;
      gap: 1.2rem;
    }

    .nav-desktop a {
      color: #ccc;
      font-size: 0.85rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 4px 0;
      transition: var(--transition);
    }

    .nav-desktop a:hover {
      color: white;
    }

    /* Mobile Menu Toggle - ON THE RIGHT */
    .menu-toggle {
      display: none;
      background: none;
      border: none;
      color: white;
      font-size: 1.4rem;
      cursor: pointer;
    }

    .nav-mobile {
      display: none;
      position: absolute;
      top: 50px;
      left: 0;
      width: 100%;
      background: var(--black);
      padding: 0.5rem 0;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    }

    .nav-mobile a {
      display: block;
      color: #ddd;
      font-size: 0.9rem;
      padding: 0.6rem 1.5rem;
      font-weight: 500;
    }

    .nav-mobile a:hover {
      background: rgba(106, 27, 154, 0.2);
      color: white;
    }

    /* === HERO === */
    .hero {
      background: linear-gradient(rgba(10,10,10,0.75), rgba(10,10,10,0.75)), url('https://images.unsplash.com/photo-1560518883-ce09059eeffa?ixlib=rb-4.0.3&auto=format&fit=crop&w=1350&q=80') center/cover no-repeat;
      color: white;
      text-align: center;
      padding: 4.5rem 1rem 3rem;
    }

    .hero h1 {
      font-size: 2.1rem;
      margin-bottom: 0.6rem;
      font-weight: 700;
    }

    .hero p {
      font-size: 1.05rem;
      max-width: 700px;
      margin: 0 auto 1.2rem;
      opacity: 0.95;
    }

    .btn {
      display: inline-block;
      background: var(--primary-purple);
      color: white;
      padding: 0.7rem 1.6rem;
      border-radius: 4px;
      font-weight: 600;
      font-size: 0.95rem;
      transition: var(--transition);
    }

    .btn:hover {
      background: var(--light-purple);
      transform: translateY(-1px);
    }

    /* === SECTIONS === */
    section {
      padding: 3rem 0;
    }

    .section-title {
      text-align: center;
      font-size: 1.8rem;
      margin-bottom: 2rem;
      color: var(--black);
      position: relative;
    }

    .section-title:after {
      content: '';
      width: 40px;
      height: 2px;
      background: var(--primary-purple);
      display: block;
      margin: 0.6rem auto 0;
    }

    /* About */
    .about-grid {
      max-width: 800px;
      margin: 0 auto;
    }

    .about-text p {
      margin-bottom: 1rem;
      font-size: 1rem;
      color: #444;
    }

    /* Services */
    .services-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 1.2rem;
    }

    .service-card {
      background: white;
      padding: 1.5rem;
      border-radius: 6px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.04);
      border: 1px solid var(--silver);
      transition: var(--transition);
    }

    .service-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 6px 20px rgba(0,0,0,0.08);
    }

    .service-card h3 {
      color: var(--primary-purple);
      margin-bottom: 0.7rem;
      font-size: 1.1rem;
    }

    .service-card ul {
      list-style: none;
      font-size: 0.9rem;
      color: #555;
    }

    .service-card li {
      margin-bottom: 0.3rem;
      position: relative;
      padding-left: 1rem;
    }

    .service-card li:before {
      content: "•";
      color: var(--primary-purple);
      position: absolute;
      left: 0;
      font-weight: bold;
    }

    /* Portfolio */
    .portfolio {
      background: var(--light-silver);
    }

    .portfolio-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
    }

    .portfolio-item {
      background: white;
      padding: 1rem;
      border-radius: 6px;
      text-align: center;
      font-size: 0.9rem;
      font-weight: 500;
      box-shadow: 0 2px 6px rgba(0,0,0,0.04);
      border: 1px solid var(--silver);
    }

    /* Contact */
    .contact {
      background: var(--black);
      color: white;
    }

    .contact .section-title { color: white; }
    .contact .section-title:after { background: var(--primary-purple); }

    /* Footer */
    footer {
      background: var(--black);
      color: #999;
      text-align: center;
      padding: 1.2rem 0;
      font-size: 0.8rem;
    }

    /* === MOBILE === */
    @media (max-width: 768px) {
      header { height: 48px; }
      .logo { font-size: 1rem; }
      .logo img { height: 28px; margin-right: 6px; }
      .nav-desktop { display: none; }
      .menu-toggle { display: block; }
      .hero { padding: 3rem 1rem 2.5rem; }
      .hero h1 { font-size: 1.8rem; }
      .section-title { font-size: 1.6rem; }
    }
  </style>
</head>
<body>

  <!-- Clean Header - Hamburger on RIGHT -->
  <header>
    <div class="container header-inner">
      <div class="logo">
        <img src="https://raw.githubusercontent.com/benjamins123/amazonrealtygrp/7387b668d8da20b44bc74be931c4715804faf11f/image%20(
